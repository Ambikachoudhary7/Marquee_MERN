<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project on drag or drop</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f2f2;
            padding: 20px;
        }

        .container {
            padding: 20px 20px 20px 20px;
            height: 300px;
            width: 900px;
            border: 4px solid gray;
            background-color: pink;
            border-radius: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .box {
            padding: 20px 20px 20px 20px;
            margin: 40px 0 0 0;
            height: 250px;
            width: 900px;
            border: 4px solid black;
            background-color: gray;
            border-radius: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;

        }

        .container img,
        .box img {
            width: 180px;
            height: 120px;
            object-fit: cover;
            cursor: grab;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <h1>Drag Images into the Box</h1>
    <div class="container">
        <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=300" draggable="true">

        <img src="https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=300" draggable="true">

        <img src="https://images.unsplash.com/photo-1542362567-b07e54358753?w=300" draggable="true">

        <img src="https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=300" draggable="true">

        <img src="https://images.unsplash.com/photo-1502877338535-766e1452684a?w=300" draggable="true">
    </div>
    <div class="box">

    </div>
    <script>
        let image = document.querySelectorAll("img");
        let container = document.querySelector(".container");
        let box = document.querySelector(".box");
        let select = null;
        image.forEach((img) => {
            img.addEventListener("dragstart", function () {
                select = img;
            });
        })
        container.addEventListener("dragover", function (e) {
            e.preventDefault();
        });
        box.addEventListener("drop", function () {
            box.appendChild(select);
        })
        box.addEventListener("dragover", function (e) {
            e.preventDefault();
        });
        container.addEventListener("drop", function () {
            container.appendChild(select);
        })



    </script>
</body>

</html>
