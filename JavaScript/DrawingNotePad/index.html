<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawing Notepad</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #dfe9d7;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: 1100px;
            margin: 20px auto;
        }

        .upper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .display {
            width: 1000px;
            height: 550px;
            border: 2px solid blue;
            border-radius: 15px;
            background: #eef6ea;
            position: relative;
            overflow: hidden;
            margin: auto;
        }

        .bottom {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dot {
            position: absolute;
            border-radius: 50%;
        }

        button {
            padding: 8px 18px;
            cursor: pointer;
            background-color: gray;
            color: white;
            border-radius: 10px;
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="upper">

            <p>Change Theme :</p>

            <button id="dark">Dark</button>

            <button id="light">Light</button>

            <button id="bw">Black & White</button>

        </div>

        <div class="display" id="board"></div>

        <div class="bottom">

            <button id="clear">Clear</button>

            <div>

                Brush Size

                <input type="range" id="size" min="2" max="30" value="10">

            </div>

            <div>

                Color

                <input type="color" id="color" value="#ff0000">

            </div>

        </div>

    </div>

    <script>

        const board = document.getElementById("board");

        const size = document.getElementById("size");

        const color = document.getElementById("color");

        const clear = document.getElementById("clear");

        const dark = document.getElementById("dark");

        const light = document.getElementById("light");

        const bw = document.getElementById("bw");

        let drawing = false;

        let drawColor = color.value;



        board.addEventListener("mousedown", () => {

            drawing = true;

        });



        board.addEventListener("mouseup", () => {

            drawing = false;

        });



        board.addEventListener("mouseleave", () => {

            drawing = false;

        });



        board.addEventListener("mousemove", (e) => {

            if (!drawing) return;

            const dot = document.createElement("div");

            dot.className = "dot";

            dot.style.width = size.value + "px";

            dot.style.height = size.value + "px";

            dot.style.left = e.offsetX - size.value / 2 + "px";

            dot.style.top = e.offsetY - size.value / 2 + "px";

            dot.style.background = drawColor;

            board.appendChild(dot);

        });



        color.addEventListener("input", () => {

            drawColor = color.value;

        });



        clear.addEventListener("click", () => {

            board.innerHTML = "";

        });



        light.addEventListener("click", () => {

            document.body.style.background = "#dfe9d7";

            board.style.background = "#eef6ea";

            drawColor = color.value;

        });



        dark.addEventListener("click", () => {

            document.body.style.background = "#222";

            board.style.background = "#444";

            drawColor = color.value;

        });



        bw.addEventListener("click", () => {

            document.body.style.background = "white";

            board.style.background = "white";

            drawColor = "black";

        });
        board.addEventListener("mouseenter", () => {
            board.style.border = "2px solid red";
        });

        board.addEventListener("mouseleave", () => {
            board.style.border = "2px solid blue";
        });
        size.addEventListener("click", function(){
            
        })

    </script>

</body>

</html>
