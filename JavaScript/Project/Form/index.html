<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f5f5f5;
            padding: 30px;
        }

        .container {
            width: 80%;
            max-width: 900px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
        }

        h2 {
            margin-bottom: 20px;
        }

        .form-box {
            margin-bottom: 15px;
        }

        label {
            display: inline-block;
            width: 120px;
            font-weight: bold;
        }

        input,
        select {
            width: 250px;
            padding: 8px;
        }

        button {
            margin-top: 10px;
            padding: 10px 20px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #444;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <h2>Add Product</h2>

            <form id="form">

                <div class="form-box">
                    <label>Name</label>
                    <input type="text" id="name" required>
                </div>

                <div class="form-box">
                    <label>Category</label>

                    <select id="category" required>
                        <option value="">Select</option>
                        <option>Electronics</option>
                        <option>Groceries</option>
                        <option>Books</option>
                        <option>Sports</option>
                        <option>Furniture</option>
                    </select>

                </div>

                <div class="form-box">
                    <label>Price</label>
                    <input type="number" id="price" required>
                </div>

                <div class="form-box">
                    <label>Quantity</label>
                    <input type="number" id="quantity" required>
                </div>

                <button type="submit">Add Product</button>

            </form>

        </div>

        <div class="card">

            <h2>Products</h2>

            <table>

                <thead>
                    <tr>
                        <th>Sr.</th>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Quantity</th>
                    </tr>
                </thead>

                <tbody id="tbody">

                </tbody>

            </table>

        </div>

    </div>

    <script>

        const form = document.getElementById("form");
        const tbody = document.getElementById("tbody");

        let sr = 1;

        form.addEventListener("submit", function (e) {

            e.preventDefault();

            let name = document.getElementById("name").value;
            let category = document.getElementById("category").value;
            let price = document.getElementById("price").value;
            let quantity = document.getElementById("quantity").value;

            let tr = document.createElement("tr");

            tr.innerHTML = `
        <td>${sr++}</td>
        <td>${name}</td>
        <td>${category}</td>
        <td>₹${price}</td>
        <td>${quantity}</td>
    `;

            tbody.appendChild(tr);

            form.reset();

        });

    </script>

</body>

</html>
